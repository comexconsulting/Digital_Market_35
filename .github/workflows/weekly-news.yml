name: Generar noticia semanal

on:
  schedule:
    # Lunes 12:00 UTC = 09:00 hora Argentina
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

concurrency:
  group: weekly-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Generar artículo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate:news

      - name: Commitear y pushear si hay un artículo nuevo
        run: |
          git config user.name "digital-market-35-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/news
          if git diff --cached --quiet; then
            echo "Sin cambios — no se generó ningún artículo nuevo esta corrida."
          else
            git commit -m "chore(noticias): artículo semanal automático"
            git push
          fi
